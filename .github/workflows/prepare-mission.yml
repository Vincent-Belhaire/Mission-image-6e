name: Préparer la séance 8
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.build/READY']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer le moteur de rendu SVG
        run: python -m pip install cairosvg==2.8.2
      - name: Reconstituer le site et les documents
        run: python .build/prepare.py
      - name: Enregistrer les fichiers prêts à utiliser
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html style.css script.js galerie.html assets ressources enseignant README.txt TESTS.txt .nojekyll Mission-image-6e.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Publier la séance 8 complète : site, images et documents Writer'
            git push origin HEAD:main
          fi
